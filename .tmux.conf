# ─── Prefix ───────────────────────────────────────────────────────────────────
# Change prefix from C-b to C-a (easier to reach)
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# ─── General ──────────────────────────────────────────────────────────────────
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"   # true color support
set -g history-limit 10000
set -g base-index 1           # windows start at 1, not 0
setw -g pane-base-index 1
set -g renumber-windows on    # renumber when a window is closed
set -sg escape-time 0         # no delay after Escape (important for vim)
set -g focus-events on
set -g mouse on               # enable mouse support

# ─── Key Bindings ─────────────────────────────────────────────────────────────
# Reload config
bind r source-file ~/.tmux.conf \; display "Config reloaded"

# Split panes using | and - (intuitive)
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# New window in current path
bind c new-window -c "#{pane_current_path}"

# Vim-style pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Resize panes with Shift+arrow (no prefix needed with -r repeat flag)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Quick window switching
bind -r C-h select-window -t :-
bind -r C-l select-window -t :+

# Copy mode (vi-style)

setw -g mode-keys vi
bind Enter copy-mode
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "xclip -in -selection clipboard"
bind -T copy-mode-vi Escape send -X cancel

# ─── Status Bar ───────────────────────────────────────────────────────────────
set -g status on
set -g status-interval 5
set -g status-position bottom
set -g status-justify left

# Colors
set -g status-style "bg=#1e1e2e,fg=#cdd6f4"
set -g message-style "bg=#313244,fg=#cdd6f4"
set -g message-command-style "bg=#313244,fg=#cdd6f4"

# Left: session name
set -g status-left-length 40
set -g status-left "#[bg=#89b4fa,fg=#1e1e2e,bold] #S #[bg=#1e1e2e,fg=#89b4fa]"

# Right: host + time
set -g status-right-length 60
set -g status-right "#[fg=#6c7086]#H  #[fg=#a6adc8]%H:%M  %d %b "

# Window tabs
setw -g window-status-format " #I:#W "
setw -g window-status-current-format "#[bg=#313244,fg=#89b4fa,bold] #I:#W "
setw -g window-status-style "fg=#6c7086"
setw -g window-status-current-style "fg=#89b4fa"

# ─── Pane Borders ─────────────────────────────────────────────────────────────
set -g pane-border-style "fg=#313244"
set -g pane-active-border-style "fg=#89b4fa"

# ─── Misc ─────────────────────────────────────────────────────────────────────
# Dim inactive panes slightly
setw -g window-style "bg=#181825"
setw -g window-active-style "bg=#1e1e2e"

# Don't auto-rename windows once you've named them
set -g allow-rename off
